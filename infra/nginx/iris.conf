# ÍRIS — Nginx reverse proxy (Fase 0)
# Única porta pública: 443. A 80 só redireciona e serve o desafio ACME (Let's Encrypt).
# Decisão: usar SUBDOMÍNIOS (iris. e bi.) em vez de subpaths (/iris, /bi) — n8n e Metabase
#   atrás de subpath são frágeis; subdomínio é o caminho robusto. (ganha: simplicidade/estabilidade;
#   perde: 2 registros DNS + 2 certificados; obriga: apontar os dois subdomínios no DNS.)
#
# ANTES DE SUBIR: troque "SEU_DOMINIO" pelo seu domínio real nos 3 lugares abaixo, ex.:
#   sed -i 's/SEU_DOMINIO/arkhentecnologia.com.br/g' infra/nginx/iris.conf
# e gere os certificados com o Certbot (ver infra/README.md).

# --- HTTP (80): ACME + redirect para HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name iris.SEU_DOMINIO bi.SEU_DOMINIO;

    # Desafio do Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo o resto vai para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- n8n (iris.SEU_DOMINIO) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name iris.SEU_DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/iris.SEU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iris.SEU_DOMINIO/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # HSTS (só quando o HTTPS estiver 100% OK)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Health check simples servido pelo próprio Nginx
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://n8n:5678;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (editor do n8n)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

# --- Metabase (bi.SEU_DOMINIO) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bi.SEU_DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/bi.SEU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bi.SEU_DOMINIO/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://metabase:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
